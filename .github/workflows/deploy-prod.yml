name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      run_migration:
        description: "Run database migration"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::789748176137:role/OunwanGitHubActionsRole
          aws-region: ap-northeast-2

      - name: Deploy via SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0d3bfe71aae852f9c" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/ounwan",
              "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 789748176137.dkr.ecr.ap-northeast-2.amazonaws.com",
              "docker compose --env-file .env.production.local -f compose.prod.yaml pull",
              "docker compose --env-file .env.production.local -f compose.prod.yaml up -d postgres",
              "if [ \"${{ inputs.run_migration }}\" = \"true\" ]; then docker compose --env-file .env.production.local -f compose.prod.yaml run --rm app npm run db:migrate; fi",
              "docker compose --env-file .env.production.local -f compose.prod.yaml up -d"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0d3bfe71aae852f9c"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0d3bfe71aae852f9c"

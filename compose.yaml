services:
  app:
    build:
      context: .
      secrets:
        - env
    container_name: ounwan-app
    env_file:
      - .env.production.local
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ounwan-network

  postgres:
    image: postgres:16-alpine
    container_name: ounwan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ounwan_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ounwan-network

volumes:
  ounwan_postgres_data:
    external: true

networks:
  ounwan-network:

secrets:
  env:
    file: .env.production.local
services:
  nginx:
    image: nginx:alpine
    container_name: ounwan-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - ounwan-network

  app:
    image: ${APP_IMAGE}
    container_name: ounwan-app
    env_file:
      - .env.production.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ounwan-network

  postgres:
    image: postgres:16-alpine
    container_name: ounwan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ounwan_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ounwan-network

volumes:
  ounwan_postgres_data:

networks:
  ounwan-network: